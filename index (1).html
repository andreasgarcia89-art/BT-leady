<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BT Leady – akce</title>
<style>
:root{--bg:#F4F5F2;--fg:#17191C;--muted:#5A6069;--accent:#1D4ED8;--accent-fg:#fff;--line:#C9CCC6}
@media (prefers-color-scheme: dark){:root{--bg:#131518;--fg:#ECEDEE;--muted:#A3A9B1;--accent:#6E95F7;--accent-fg:#0E1525;--line:#40454D;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:15px}
.big{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:600;text-decoration:none;border:0;font-family:inherit;cursor:pointer}
.sec{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="h">Otevírám…</h1>
  <p id="p"></p>
  <a class="big" id="go" href="#">Pokračovat</a>
  <a class="sec" id="alt" href="#" hidden style="text-decoration:none">Nejde to? Stáhnout jako soubor</a>
  <button class="sec" id="back" type="button">Zpět do aplikace</button>
</main>
<script>
(function(){
  var q={};location.hash.replace(/^#/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');q[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1));});
  var h=document.getElementById('h'),p=document.getElementById('p'),go=document.getElementById('go'),alt=document.getElementById('alt');
  function back(){try{window.close();}catch(e){}setTimeout(function(){if(history.length>1)history.back();},150);}
  document.getElementById('back').onclick=back;
  // po návratu z telefonu / Zpráv / Kontaktů se pomocná stránka sama zavře
  var left=false;document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')left=true;else if(left)back();});
  function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\;').replace(/\r?\n/g,'\\n');}
  var who=q.n||q.v;
  if(q.k==='tel'||q.k==='sms'||q.k==='mail'){
    var url=(q.k==='mail'?'mailto:':q.k+':')+q.v;
    h.textContent=q.k==='tel'?'Zavolat '+who:(q.k==='sms'?'SMS pro '+who:'E-mail pro '+who);
    go.textContent=q.k==='tel'?'Zavolat':(q.k==='sms'?'Napsat SMS':'Napsat e-mail');
    go.href=url;
    location.href=url;
  } else if(q.k==='vcf'){
    var name=(q.fn+' '+q.ln).trim();
    var v=['BEGIN:VCARD','VERSION:3.0','N:'+esc(q.ln)+';'+esc(q.fn)+';;;','FN:'+esc(name),
      q.o?'ORG:'+esc(q.o):'',q.t?'TEL;TYPE=CELL:'+q.t:'',q.e?'EMAIL;TYPE=INTERNET:'+q.e:'',q.c?'ADR;TYPE=WORK:;;;'+esc(q.c)+';;;CZ':'',q.n?'NOTE:'+esc(q.n):'','END:VCARD'].filter(Boolean).join('\r\n')+'\r\n';
    var data='data:text/vcard;charset=utf-8,'+encodeURIComponent(v);
    var u=URL.createObjectURL(new Blob([v],{type:'text/vcard;charset=utf-8'}));
    h.textContent='Uložit '+name;
    p.textContent='Otevře se karta kontaktu – klepni na „Vytvořit nový kontakt“, jméno si můžeš upravit a pak dej Hotovo.';
    go.textContent='Uložit do Kontaktů';go.href=data;
    alt.hidden=false;alt.href=u;alt.setAttribute('download',(name||'kontakt')+'.vcf');
    location.href=data;
  } else {h.textContent='Neplatný odkaz';go.hidden=true;}
})();
</script>
</body>
</html>
